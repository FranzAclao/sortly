[package]
name = "sortly"
version = "0.1.0"
description = "Sortly - AI File Organizer"
authors = ["you"]
edition = "2021"

[lib]
name = "sortly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sortly"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
